# Render Blueprint: creates the PestGuard server (API + live updates + admin website).
# Database: a free Neon Postgres database. Paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: pestguard
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm ci --no-audit --no-fund && cd ../admin-web && npm ci --no-audit --no-fund && npm run build
    startCommand: cd server && npm run migrate && npm run seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false
