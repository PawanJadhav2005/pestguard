# Builds PestGuard.apk on GitHub's servers. Run it from the Actions tab ("Build Android APK" > Run workflow).
name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server address the app connects to by default (can be changed on the sign-in screen)'
        required: true
        default: 'http://192.168.1.10:4000'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: Set server address
        run: node -e "const f='app.json',j=require('./'+f);j.expo.extra={...j.expo.extra,apiUrl:process.argv[1]};require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "${{ inputs.server_url }}"
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env: { CI: '1' }
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PestGuard-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
